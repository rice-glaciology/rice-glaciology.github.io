# Custom minimal theme with teal/slate blue accents
name = "Custom"

[light]
  # Primary accent color (teal/slate blue)
  primary = "#4a9aab"

  # Link colors
  link = "#4a9aab"
  link_hover = "#357989"

  # Menu
  menu_primary = "#ffffff"
  menu_text = "#888888"
  menu_text_active = "#4a9aab"
  menu_title = "#2a2a2a"

  # Home sections
  home_section_odd = "rgb(255, 255, 255)"
  home_section_even = "rgb(249, 249, 249)"

[dark]
  primary = "#7ec8d6"
  link = "#7ec8d6"
  link_hover = "#4a9aab"
